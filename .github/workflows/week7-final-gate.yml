name: Week 7 Final Gate
on: [push, pull_request]
jobs:
  tracker-and-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python verify_week7_tracker.py
      - run: python verify_week7_final_gate.py
      - run: python -m pip install -r requirements.txt
      - run: PYTHONPATH=. LLM_PROVIDER=none python -m compileall backend
      - run: PYTHONPATH=. LLM_PROVIDER=none python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
